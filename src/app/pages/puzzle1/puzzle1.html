<div class="oracle-page">
  <div class="oracle-background"></div>

  <div class="oracle-frame-container">
    <div class="oracle-frame-layout">
      <img class="oracle-frame" src="/ui/frame.png" alt="Frame" />

      <div class="oracle-inner">
        <div class="oracle-content">
          <div class="puzzle-content">
            <div class="content-top">
              <h1 class="oracle-title">1. Loģika</h1>
            </div>

            <div class="symbols-row">
              @for (symbol of symbols; track symbol) {
                <div
                  class="symbol"
                  [class.symbol-empty]="isUsed(symbol)"
                  [class.selected]="selectedSymbol === symbol"
                  (click)="selectSymbol(symbol)"
                >
                  <span class="symbol-glyph">
                    {{ symbol }}
                  </span>
                </div>
              }
            </div>

            <div class="slots-row" [class.error]="showError">
              @for (slot of slots; track $index) {
                <div
                  class="slot"
                  [class.filled]="slot"
                  [class.slot-flash]="recentlyFilledSlot === $index"
                  (click)="slot ? removeFromSlot($index) : placeIntoSlot($index)"
                >
                  <img class="slot-image" src="/ui/symbol-slot.png" alt="Slot" />

                  @if (slot) {
                    <div class="slot-symbol">
                      {{ slot }}
                    </div>
                  }
                </div>
              }
            </div>
          </div>
        </div>

        <div class="oracle-controls oracle-controls-bottom">
          <div class="control-left"></div>

          <div class="control-right">
            <div class="oracle-button" [class.ready]="isReady">
              <img class="oracle-button-image" src="/ui/button-primary.png" alt="Button" />

              <button type="button" [disabled]="!isReady" (click)="submit()">APSTIPRINĀT</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
