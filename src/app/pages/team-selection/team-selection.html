<div class="oracle-page">
  <div class="oracle-background"></div>

  <div class="oracle-frame-container">
    <div class="oracle-frame-layout">
      <img class="oracle-frame" src="/ui/frame.png" alt="Frame" />

      <div class="oracle-inner">
        <div class="oracle-content content-centered">
          <div class="content">
            <h1 class="oracle-title">ORĀKULA PĀRBAUDĪJUMS</h1>

            <p class="intro-text">Izvēlies savu ceļu.</p>

            <div class="oracle-button team-button team-button-gray">
              <img class="oracle-button-image" src="/ui/button-primary.png" alt="Button" />

              <button type="button" (click)="selectTeam('gray')">PELĒKĀ KOMANDA</button>
            </div>

            <div class="oracle-button team-button team-button-sand">
              <img class="oracle-button-image" src="/ui/button-primary.png" alt="Button" />

              <button type="button" (click)="selectTeam('sand')">SMILŠU KOMANDA</button>
            </div>

            <div class="oracle-button team-button team-button-green">
              <img class="oracle-button-image" src="/ui/button-primary.png" alt="Button" />

              <button type="button" (click)="selectTeam('green')">ZAĻĀ KOMANDA</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
